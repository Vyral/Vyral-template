<div class="author-container">
    <div class="image">
        <img src="{{ site.baseurl }}{{ site.data.settings.blog.author.image }}" alt="{{ site.data.settings.blog.author.name }} profile image" />
    </div>

    <div class="author-info">
        {% if site.data.settings.blog.author.name_link != null %}
        <p class="name">By 
            <span> 
                <a href="{{ site.data.settings.blog.author.name_link }}"{% if site.data.settings.blog.author.name_link contains '://' %} target="_blank" rel="noopener"{% endif %}>
                    <span>
                        {{ site.data.settings.blog.author.name }}
                    </span>
                </a>
            </span>
        </p>
        {% else %}
        <p class="name">By 
            <span> 
                <span>
                    {{ site.data.settings.blog.author.name }}
                </span>
            </span>   
        </p>
        {% endif %}

        <p class="bio">{{ site.data.settings.blog.author.bio }}</p>
    </div>
</div>
